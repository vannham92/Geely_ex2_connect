# Build & Publish Release workflow
# Trigger: push a tag matching v*
# Requires secret: RELEASE_PAT (fine-grained PAT with repo Contents: read/write and Releases: read/write)
name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

env:
  GRADLE_USER_HOME: /tmp/.gradle

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: Make gradle wrappers executable
        run: |
          chmod +x ./gradlew || true
          chmod +x ./ex2-phone/gradlew || true
          chmod +x ./geely_ex2_tools/gradlew || true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build ex2-phone (release)
        working-directory: ./ex2-phone
        run: |
          chmod +x ./gradlew || true
          echo "JAVA_HOME=${JAVA_HOME}"
          ./gradlew -Dorg.gradle.java.home="${JAVA_HOME}" :app:assembleRelease --no-daemon --stacktrace

      - name: Build geely_ex2_tools (system/user release)
        working-directory: ./geely_ex2_tools
        run: |
          chmod +x ./gradlew || true
          echo "JAVA_HOME=${JAVA_HOME}"
          set -e
          # Try system release first (if configured), otherwise try user release
          ./gradlew -Dorg.gradle.java.home="${JAVA_HOME}" :app:assembleSystemRelease --no-daemon --stacktrace || true
          ./gradlew -Dorg.gradle.java.home="${JAVA_HOME}" :app:assembleUserRelease --no-daemon --stacktrace || true

      - name: Determine APK paths
        id: paths
        run: |
          # ex2-phone release apk (expected)
          if [ -f "ex2-phone/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "EX2_PHONE_APK=ex2-phone/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
          else
            FPATH=$(find ex2-phone/app/build/outputs -type f -name "*.apk" | head -n1 || true)
            echo "EX2_PHONE_APK=${FPATH}" >> $GITHUB_OUTPUT
          fi

          # geely system apk
          if ls geely_ex2_tools/app/build/outputs/apk/system/release/*.apk 1> /dev/null 2>&1; then
            SYSAPK=$(ls geely_ex2_tools/app/build/outputs/apk/system/release/*.apk | head -n1)
            echo "GEELY_SYSTEM_APK=${SYSAPK}" >> $GITHUB_OUTPUT
          else
            echo "GEELY_SYSTEM_APK=" >> $GITHUB_OUTPUT
          fi

          # geely user apk
          if ls geely_ex2_tools/app/build/outputs/apk/user/release/*.apk 1> /dev/null 2>&1; then
            USERAPK=$(ls geely_ex2_tools/app/build/outputs/apk/user/release/*.apk | head -n1)
            echo "GEELY_USER_APK=${USERAPK}" >> $GITHUB_OUTPUT
          else
            echo "GEELY_USER_APK=" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Automated release for ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Upload ex2-phone APK to Release (if present)
        if: steps.paths.outputs.EX2_PHONE_APK != ''
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.paths.outputs.EX2_PHONE_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Upload geely_ex2_tools system APK to Release (if exists)
        if: steps.paths.outputs.GEELY_SYSTEM_APK != ''
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.paths.outputs.GEELY_SYSTEM_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Upload geely_ex2_tools user APK to Release (if exists)
        if: steps.paths.outputs.GEELY_USER_APK != ''
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.paths.outputs.GEELY_USER_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
