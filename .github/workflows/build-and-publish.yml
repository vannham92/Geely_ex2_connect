name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

env:
  GRADLE_USER_HOME: /tmp/.gradle

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ex2-phone (release)
        working-directory: ./ex2-phone
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build geely_ex2_tools (system release)
        working-directory: ./geely_ex2_tools
        # try system release; if not present, try user release
        run: |
          ./gradlew :app:assembleSystemRelease --no-daemon --stacktrace || true
          ./gradlew :app:assembleUserRelease --no-daemon --stacktrace || true

      - name: Determine APK paths
        id: paths
        run: |
          echo "EX2_PHONE_APK=ex2-phone/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
          # try system apk path
          if ls geely_ex2_tools/app/build/outputs/apk/system/release/*.apk 1> /dev/null 2>&1; then
            echo "GEELY_SYSTEM_APK=geely_ex2_tools/app/build/outputs/apk/system/release/$(ls geely_ex2_tools/app/build/outputs/apk/system/release | head -n1)" >> $GITHUB_OUTPUT
          fi
          # try user apk path
          if ls geely_ex2_tools/app/build/outputs/apk/user/release/*.apk 1> /dev/null 2>&1; then
            echo "GEELY_USER_APK=geely_ex2_tools/app/build/outputs/apk/user/release/$(ls geely_ex2_tools/app/build/outputs/apk/user/release | head -n1)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Upload ex2-phone APK to Release
        if: always()
        uses: softprops/action-gh-release@v1
        with:
          files: ex2-phone/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Upload geely_ex2_tools system APK to Release (if exists)
        if: steps.paths.outputs.GEELY_SYSTEM_APK != ''
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.paths.outputs.GEELY_SYSTEM_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Upload geely_ex2_tools user APK to Release (if exists)
        if: steps.paths.outputs.GEELY_USER_APK != ''
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.paths.outputs.GEELY_USER_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
